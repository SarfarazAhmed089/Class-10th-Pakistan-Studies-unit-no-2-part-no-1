<style>
:root{--blue:#d63384;--sky:#ff8fc7;--pale:#fff0f7;--ink:#54233f;--muted:#9a6a83;--line:#f6cfe2;--green:#159b62;--red:#df5363}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 5%,#ffe0ef,transparent 28%),radial-gradient(circle at 95% 10%,#ffe7f3,transparent 27%),linear-gradient(135deg,#fffafd,#fff0f7 55%,#fff8fc);min-height:100vh}
.container{width:min(940px,93%);margin:auto;padding:28px 0 42px}
.hero{text-align:center;position:relative;overflow:hidden;padding:38px 22px;margin-bottom:20px;border:1px solid #f6c5dd;border-radius:25px;background:linear-gradient(135deg,#fff,#ffe4f1);box-shadow:0 12px 32px #b3267018}
.badge{display:inline-block;padding:8px 14px;border-radius:99px;background:#ffe0ef;color:#a51e62;border:1px solid #f3b4d2;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
h1{margin:17px 0 9px;font-size:clamp(30px,5vw,48px);line-height:1.15;color:#59213f}
.subtitle{margin:0;color:var(--muted);font-size:16px;line-height:1.65}
.author{display:inline-block;margin-top:14px;padding:9px 15px;background:#fff;border:1px solid var(--line);border-radius:10px;color:#b32670;font-size:14px;font-weight:700}
.progress-card{position:sticky;top:9px;z-index:5;display:flex;align-items:center;gap:14px;padding:13px 15px;margin-bottom:17px;border:1px solid var(--line);border-radius:14px;background:#fffafdF2;backdrop-filter:blur(12px);box-shadow:0 7px 22px #b3267014}
.progress-text{min-width:125px;color:#a51e62;font-size:12px;font-weight:800}
.progress-bar{height:9px;flex:1;overflow:hidden;border-radius:99px;background:#f9dce9}
.progress-fill{width:0;height:100%;background:linear-gradient(90deg,#ff9ccc,#d63384);border-radius:99px;transition:width .25s}
.quiz-card{padding:23px;margin-bottom:16px;border:1px solid var(--line);border-radius:19px;background:#fffafdF2;box-shadow:0 8px 24px #b3267012;transition:.2s}
.quiz-card:hover{transform:translateY(-2px);border-color:#ee9dc5;box-shadow:0 13px 30px #d633841b}
.question-top{margin-bottom:12px}
.question-number{display:inline-block;padding:6px 10px;border-radius:8px;background:#ffe5f1;color:#ad286b;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.question{font-size:18px;font-weight:750;line-height:1.55;margin-bottom:15px;color:#59213f}
.option{display:flex;align-items:center;gap:11px;padding:12px 14px;margin:9px 0;border:1.5px solid #f5dce8;border-radius:12px;background:#fffafd;color:#71415c;cursor:pointer;transition:.18s}
.option:hover{border-color:#ed9bc2;background:#fff0f7;transform:translateX(2px)}
.option input{accent-color:var(--blue);margin:0;flex-shrink:0}
.letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;min-width:26px;border-radius:8px;background:#ffe2f0;color:#ad286b;font-size:12px;font-weight:800}
.correct{background:#e9faf2!important;border-color:#67c99b!important;color:#11653f!important}
.correct .letter{background:var(--green);color:#fff}
.wrong{background:#fff0f2!important;border-color:#e98c97!important;color:#9b2d3a!important}
.wrong .letter{background:var(--red);color:#fff}
.actions{text-align:center;padding:12px 0 22px}
button{border:0;border-radius:12px;padding:13px 23px;margin:5px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px)}
#submitBtn{background:linear-gradient(135deg,#c21870,#f46fb2);color:#fff;box-shadow:0 8px 20px #d6338435}
#resetBtn{background:#ffe5f1;border:1px solid #f2b9d4;color:#a51e62}
button:disabled{opacity:.55;cursor:not-allowed}
.result{display:none;text-align:center;padding:28px 20px;margin:8px 0 23px;border:1px solid #f2b9d4;border-radius:21px;background:linear-gradient(135deg,#fff,#ffe8f3);box-shadow:0 10px 30px #b3267018}
.result h2{margin:0;color:#59213f}
.score{font-size:clamp(42px,8vw,62px);font-weight:850;color:var(--blue);margin:10px 0}
#message{color:var(--muted);font-weight:600}
.footer{text-align:center;color:#a98398;font-size:12px;padding:8px 0}
@media(max-width:600px){.container{width:92%;padding-top:16px}.hero{padding:30px 16px;border-radius:20px}.quiz-card{padding:17px;border-radius:16px}.question{font-size:16px}.subtitle{font-size:14px}.progress-text{min-width:105px;font-size:11px}.option{padding:11px 10px}}
</style>

<body>

        <div class="author">by Sarfaraz Ahmed · Total 28 Questions</div>

    <div class="progress-card">

        </div>
    </div>

    <main id="quiz"></main>

    <div class="actions">

    </div>

        <h2>Your Final Score</h2>

const quiz = document.getElementById("quiz");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");

function renderQuiz() {
    quiz.innerHTML = "";

    quizData.forEach((item, index) => {
        const card = document.createElement("section");
        card.className = "quiz-card";

        const top = document.createElement("div");
        top.className = "question-top";
        top.innerHTML = `<span class="question-number">Question ${index + 1}</span>`;

        const question = document.createElement("div");
        question.className = "question";
        question.textContent = item.q;

        card.appendChild(top);
        card.appendChild(question);

        item.options.forEach((option, optionIndex) => {
            const label = document.createElement("label");
            label.className = "option";
            label.dataset.question = index;
            label.dataset.option = optionIndex;

            const letter = String.fromCharCode(65 + optionIndex);

            label.innerHTML = `
                <input type="radio" name="q${index}" value="${optionIndex}">
                <span class="letter">${letter}</span>
                <span>${option}</span>
            `;

            label.querySelector("input").addEventListener("change", updateProgress);
            card.appendChild(label);
        });

        quiz.appendChild(card);
    });

    updateProgress();
}

function updateProgress() {
    const answered = document.querySelectorAll(
        'input[type="radio"]:checked'
    ).length;

    progressText.textContent = `${answered} of ${quizData.length} answered`;
    progressFill.style.width = `${(answered / quizData.length) * 100}%`;
}

function submitQuiz() {
    let score = 0;

    quizData.forEach((item, index) => {
        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const labels = document.querySelectorAll(
            `[data-question="${index}"]`
        );

        labels.forEach(label => {
            const optionIndex = Number(label.dataset.option);

            if (optionIndex === item.answer) {
                label.classList.add("correct");
            }
        });

        if (selected) {
            const selectedIndex = Number(selected.value);

            if (selectedIndex === item.answer) {
                score++;
            } else {
                const wrongLabel = document.querySelector(
                    `[data-question="${index}"][data-option="${selectedIndex}"]`
                );

                if (wrongLabel) {
                    wrongLabel.classList.add("wrong");
                }
            }
        }
    });

    const percentage = (score / quizData.length) * 100;

    document.getElementById("score").textContent =
        `${score} / ${quizData.length}`;

    let message = "";

    if (percentage === 100) {
        message = "Outstanding! 🎉 Perfect score. Excellent work!";
    } else if (percentage >= 80) {
        message = "Excellent! 🌟 You have a very strong understanding.";
    } else if (percentage >= 60) {
        message = "Good effort! 📚 Keep practicing to improve your score.";
    } else {
        message = "Keep studying! 💪 Review the lesson and try again.";
    }

    document.getElementById("message").textContent = message;

    const result = document.getElementById("result");
    result.style.display = "block";

    document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.disabled = true;
    });

    document.getElementById("submitBtn").disabled = true;
    result.scrollIntoView({ behavior: "smooth", block: "center" });
}

function resetQuiz() {
    renderQuiz();

    document.getElementById("result").style.display = "none";
    document.getElementById("submitBtn").disabled = false;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

renderQuiz();
</script>
